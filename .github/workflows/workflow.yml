# GitHub Actions workflow for video-transcription microservice
# NOTE: This service runs LOCALLY via Tailscale, not in K8s
# Docker images are still built for backup/future use, but deployment is disabled

name: Build video-transcription (No K8s Deploy - Runs Locally)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: 'Docker image tag to deploy (defaults to latest commit SHA)'
        required: false
        default: ''

jobs:
  build:
    name: Build and push (NO K8s deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            kasparov112000/learnbytesting-video-transcription-docker:latest
            kasparov112000/learnbytesting-video-transcription-docker:${{ github.event.inputs.deploy_tag || github.sha }}
          build-args: |
            ENV_NAME=PRODUCTION

      - name: Build complete
        run: |
          echo "=============================================="
          echo "Docker image built and pushed successfully!"
          echo "Image: kasparov112000/learnbytesting-video-transcription-docker:${{ github.sha }}"
          echo ""
          echo "NOTE: K8s deployment is DISABLED for this service."
          echo "This service runs LOCALLY via Tailscale."
          echo "=============================================="

